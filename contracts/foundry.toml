# Full reference https://github.com/foundry-rs/foundry/tree/master/crates/config
[profile.default]
solc = "0.8.38"
auto_detect_solc = false
evm_version = "osaka"
optimizer = true
via_ir = true
optimizer_runs = 10_000
bytecode_hash = "none"
allow_internal_expect_revert = true

src = "src"
test = "test"
out = "out"
script = "script"
libs = ["dependencies", "vendor"]
auto_detect_remappings = false
remappings = [
    "@openzeppelin-contracts-5.7.0/=dependencies/@openzeppelin-contracts-5.7.0/",
    "anoma-forwarder-bases-3.1.1/=dependencies/anoma-forwarder-bases-3.1.1/",
    "forge-std-1.17.0/=dependencies/forge-std-1.17.0/",
    "privacy-boost-protocol-62a8140/=vendor/privacy-boost-protocol-62a8140/",
    "solady-0.1.26/=dependencies/solady-0.1.26/",
]
ignored_warnings_from = [
    "dependencies/@openzeppelin-contracts-5.7.0/utils", # Warning 6335: "error" and "at" will be promoted to keyword in the future and will not be allowed as an identifier anymore.
    "dependencies/solady-0.1.26/src/utils",             # Warning 2424: Natspec memory-safe-assembly special comment for inline assembly is deprecated
]

[lint]
severity = ["high", "medium", "low", "info", "gas", "code-size"] # The default leaves out info, gas, and code-size.
exclude_lints = [
    "internal-function-used-once", # Counts the call sites of `src` alone, because `ignore` hides those of the tests.
]
ignore = ["test/**/*.sol"]                                       # Relaxed the way `.solhint.other.json` relaxes them.

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
"anoma-forwarder-bases" = "3.1.1"
"forge-std" = "1.17.0"
"solady" = "0.1.26"

[soldeer]
# The imported files of forwarder-bases need OpenZeppelin alone.
recursive_deps = false
remappings_location = "config"
remappings_generate = true
remappings_version = true

[fuzz]
runs = 1_000

[profile.ci]
fuzz = { runs = 1_000 }
verbosity = 3

