[package]
name = "anoma-integration-test"
description = "The fixtures and the end-to-end tests of the Anoma local circuits, crates and contracts"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
publish = false

[features]
# Runs the tests that prove transactions and execute them on anvil, and the benchmarks of the proof times and of the
# gas. They take minutes and many gigabytes of memory.
slow-tests = []

[dependencies]
alloy = { workspace = true }
anoma-arm = { workspace = true }
anoma-bindings = { workspace = true }
anoma-discovery = { workspace = true }
anoma-groth16-wrap = { workspace = true }
anoma-intent = { workspace = true }
anoma-prover = { workspace = true }
anoma-token = { workspace = true }
anyhow = { workspace = true }
p256 = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[[bench]]
name = "prove_times"
harness = false
required-features = ["slow-tests"]

[[bench]]
name = "execution_gas"
harness = false
required-features = ["slow-tests"]
