[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Heueristik"]
edition = "2024"
license = "Apache-2.0"
homepage = "https://anoma.net/"

[workspace.dependencies]
acir_field = "1.0.0"
aes-gcm = "0.10.3"
alloy = { version = "2.6.1", features = ["full", "node-bindings"] }
anoma-arm = { path = "crates/arm" }
anoma-bindings = { path = "crates/bindings" }
anoma-discovery = { path = "crates/discovery" }
anoma-groth16-wrap = { path = "crates/groth16-wrap" }
anoma-integration-test = { path = "crates/integration-test" }
anoma-intent = { path = "crates/intent" }
anoma-intent-pool = { path = "crates/intent-pool" }
anoma-prover = { path = "crates/prover" }
anyhow = "1.0.104"
ark-bn254 = { version = "0.6.0", default-features = false, features = ["scalar_field"] }
ark-ec = "0.6.0"
ark-ff = "0.6.0"
ark-grumpkin = "0.6.0"
bincode = "1.3.3"
bn254_blackbox_solver = "1.0.0"
cp_sat = "0.4.1"
hex = "0.4.3"
k256 = { version = "0.13.4", features = ["serde"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
toml = "1.2.1"
