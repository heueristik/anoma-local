[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Heueristik"]
edition = "2024"
license = "Apache-2.0"
homepage = "https://anoma.net/"

[workspace.dependencies]
acir_field = "1.0.0"
anyhow = "1.0.104"
ark-bn254 = { version = "0.6.0", default-features = false, features = ["scalar_field"] }
ark-ec = "0.6.0"
ark-ff = "0.6.0"
ark-grumpkin = "0.6.0"
bn254_blackbox_solver = "1.0.0"
hex = "0.4.3"
sha2 = "0.11.1"
thiserror = "2.0.21"
