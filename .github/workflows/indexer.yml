name: Indexer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each job states the permissions that it needs.
permissions: {}

# A new push to a pull request cancels the run of the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Indexer Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # The version comes from the `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: indexer/package.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: indexer/pnpm-lock.yaml

      - name: Install the indexer packages
        run: just indexer-deps

      - name: Run the indexer checks
        run: just indexer-check
